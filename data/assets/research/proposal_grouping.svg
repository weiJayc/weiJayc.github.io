<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d">
  <title id="t">User grouping schematic</title>
  <desc id="d">Six users grouped three ways. Left: one group of six over the full bandwidth B; the strongest user's power layer is a thin sliver. Middle: three pairs, each over B/3. Right: adaptive groups of four and two over bandwidths b1 and b2. Width is bandwidth, height is power; each layer is one user.</desc>
  <!-- 寬度是頻寬、高度是功率；每一層是一位使用者在 τ = 0 dB、增益相同時的最低功率比例（2^(M-k) / (2^M - 1)） -->
  <style>
    .ink { fill: #1c1c1e; }
    .g { fill: #6e6e73; }
    .ax { stroke: #a1a1a6; stroke-width: 1.5; fill: none; }
    .axf { fill: #a1a1a6; }
    text { font-family: "Hanken Grotesk", "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .h { font-size: 30px; text-anchor: middle; }
    .b { font-size: 22px; text-anchor: middle; }
    .i { font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ececee; }
      .g { fill: #9a9aa0; }
      .ax { stroke: #6c6c72; }
      .axf { fill: #6c6c72; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="axf" fill="#a1a1a6"/>
    </marker>
  </defs>

  <!-- 座標軸（只畫在左邊那組） -->
  <path class="ax" stroke="#a1a1a6" stroke-width="1.5" fill="none" d="M40 402 V104" marker-end="url(#arr)"/>
  <text class="b g i" x="40" y="92">P</text>
  <path class="ax" stroke="#a1a1a6" stroke-width="1.5" fill="none" d="M40 402 H280" marker-end="url(#arr)"/>
  <text class="b g i" x="282" y="436">f</text>
  <path class="ax" stroke="#a1a1a6" stroke-width="1.5" fill="none" d="M296 402 H506"/>
  <path class="ax" stroke="#a1a1a6" stroke-width="1.5" fill="none" d="M536 402 H746"/>

  <!-- 全部同組：M = 6 -->
  <text class="h g" x="161" y="84"><tspan class="i">M</tspan> = 6</text>
  <rect class="ink" x="56" y="255.40" width="210" height="134.60" rx="1.5" fill-opacity=".12"/>
  <rect class="ink" x="56" y="185.10" width="210" height="67.30" rx="1.5" fill-opacity=".24"/>
  <rect class="ink" x="56" y="148.45" width="210" height="33.65" rx="1.5" fill-opacity=".36"/>
  <rect class="ink" x="56" y="128.62" width="210" height="16.83" rx="1.5" fill-opacity=".48"/>
  <rect class="ink" x="56" y="117.21" width="210" height="8.41" rx="1.5" fill-opacity=".6"/>
  <rect class="ink" x="56" y="110.00" width="210" height="4.21" rx="1" fill-opacity=".72"/>
  <text class="b g" x="161" y="436"><tspan class="i">B</tspan></text>

  <!-- 固定兩人一組：M = 2 -->
  <text class="h g" x="401" y="84"><tspan class="i">M</tspan> = 2</text>
  <rect class="ink" x="296" y="205.33" width="64" height="184.67" rx="1.5" fill-opacity=".12"/>
  <rect class="ink" x="296" y="110.00" width="64" height="92.33" rx="1.5" fill-opacity=".72"/>
  <rect class="ink" x="369" y="205.33" width="64" height="184.67" rx="1.5" fill-opacity=".12"/>
  <rect class="ink" x="369" y="110.00" width="64" height="92.33" rx="1.5" fill-opacity=".72"/>
  <rect class="ink" x="442" y="205.33" width="64" height="184.67" rx="1.5" fill-opacity=".12"/>
  <rect class="ink" x="442" y="110.00" width="64" height="92.33" rx="1.5" fill-opacity=".72"/>
  <text class="b g" x="328" y="436"><tspan class="i">B</tspan>/3</text>
  <text class="b g" x="401" y="436"><tspan class="i">B</tspan>/3</text>
  <text class="b g" x="474" y="436"><tspan class="i">B</tspan>/3</text>

  <!-- 本計畫：每組人數與頻寬由可解碼條件決定 -->
  <text class="h ink" x="641" y="84" font-weight="600"><tspan class="i">M</tspan> = ?</text>
  <rect class="ink" x="536" y="245.47" width="120" height="144.53" rx="1.5" fill-opacity=".12"/>
  <rect class="ink" x="536" y="170.20" width="120" height="72.27" rx="1.5" fill-opacity=".32"/>
  <rect class="ink" x="536" y="131.07" width="120" height="36.13" rx="1.5" fill-opacity=".52"/>
  <rect class="ink" x="536" y="110.00" width="120" height="18.07" rx="1.5" fill-opacity=".72"/>
  <rect class="ink" x="665" y="205.33" width="81" height="184.67" rx="1.5" fill-opacity=".12"/>
  <rect class="ink" x="665" y="110.00" width="81" height="92.33" rx="1.5" fill-opacity=".72"/>
  <text class="b g" x="596" y="436"><tspan class="i">b</tspan><tspan font-size="15" dy="5">1</tspan></text>
  <text class="b g" x="705.5" y="436"><tspan class="i">b</tspan><tspan font-size="15" dy="5">2</tspan></text>
</svg>
